# Modèles candidats du banc d'essai. Un alias par couple fournisseur + modèle.
# Les identifiants Gemini et OpenRouter se renseignent une fois la clé disponible,
# depuis le catalogue du fournisseur, jamais de mémoire. Prix : par million de tokens,
# relevés sur la page de tarifs du fournisseur, avec la date du relevé.
releve_des_prix: null
# Catalogue Gemini relevé le 2026-11-27 par GET /v1beta/openai/models (65 modèles).
modeles:
  # Claude : en sous-agent dans Claude Code (champ model: de l'agent), ou par appel.py
  claude-fable:
    fournisseur: anthropic
    id: claude-fable-5-2
    role: direction artistique, idée créative
    prix: {entree: null, sortie: null}
  claude-opus:
    fournisseur: anthropic
    id: claude-opus-5-5
    role: scénario, vérification, construction
    prix: {entree: null, sortie: null}
  claude-sonnet:
    fournisseur: anthropic
    id: claude-sonnet-5-5
    role: recherche, application, contrôle
    prix: {entree: null, sortie: null}
  claude-haiku:
    fournisseur: anthropic
    id: claude-haiku-5-5
    role: commandes d'outil, contrôles mécaniques
    prix: {entree: null, sortie: null}
  # Gemini : par appel.py seulement
  gemini-pro:
    fournisseur: gemini
    id: gemini-3.1-pro-preview
    role: relecteur d'une autre famille, lecture longue
    prix: {entree: null, sortie: null}
  gemini-flash:
    fournisseur: gemini
    id: gemini-3.5-flash
    role: recherche et contrôles bon marché
    prix: {entree: null, sortie: null}
  # Images (banc des illustrations), par appel.py --image
  # Prix par image 1K relevés le 2026-11-27 sur la page de prix (lecture par résumé, à revérifier)
  gemini-image:
    fournisseur: gemini
    id: gemini-3.1-flash-image
    role: illustrations par défaut (décision d'Ilyas, 2026-11-27, banc 2026-11-27-flash)
    prix_image: {1K: 0.067, 2K: 0.101, 4K: 0.151}
  gemini-image-pro:
    fournisseur: gemini
    id: gemini-3-pro-image
    role: dessin complexe seulement, sur accord d'Ilyas
    prix_image: {1K: 0.134, 2K: 0.134, 4K: 0.24}
  gemini-image-lite:
    fournisseur: gemini
    id: gemini-3.1-flash-lite-image
    role: essai (plus petit, moins de détails)
    prix_image: {1K: 0.034}
  gemini-image-2-5:
    fournisseur: gemini
    id: gemini-2.5-flash-image
    role: écarté (dessin petit, arrêt du service en mars 2027)
    prix_image: {1K: 0.039}
  # Modèles ouverts : par appel.py, via OpenRouter
  ouvert-moyen:
    fournisseur: openrouter
    id: A_RENSEIGNER
    role: contrôles mécaniques, comparaisons de textes
    prix: {entree: null, sortie: null}
