<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>Thème 3 · Le flux · S03 Où passe la conduite, état final</title>
  <defs>
    <pattern id="theme3-grille" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#D3D8DF"/>
    </pattern>
  </defs>

  <!-- Fond : papier et grille de points 24 px -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#theme3-grille)"/>

  <!-- Liaison d'arrivée et port d'entrée : « une équipe reçoit une conduite d'eau » -->
  <g id="theme3-arrivee">
    <line x1="0" y1="172" x2="398" y2="172" stroke="#111418" stroke-width="1.6" stroke-linecap="butt"/>
    <polygon points="412,172 396,164 396,180" fill="#111418"/>
    <rect x="412" y="164" width="16" height="16" fill="#111418"/>
  </g>

  <!-- Carte de donnée « Conduite d'eau » -->
  <g id="theme3-carte">
    <rect x="426" y="148" width="680" height="560" fill="#111418" fill-opacity="0.08"/>
    <rect x="420" y="140" width="680" height="560" fill="#FFFFFF"/>
    <!-- Bandeau -->
    <rect x="420" y="140" width="680" height="64" fill="#E9ECF0"/>
    <text x="448" y="183" font-family="Azeret Mono" font-weight="400" font-size="30" fill="#111418">Conduite d'eau</text>
    <line x1="420" y1="204" x2="1100" y2="204" stroke="#111418" stroke-width="1.4"/>
    <!-- Compartiment du tracé (cadre principal) : la géométrie -->
    <polyline points="420,270 610,270 790,412 1100,412" fill="none" stroke="#111418" stroke-width="4" stroke-linejoin="miter" stroke-linecap="butt"/>
    <line x1="420" y1="484" x2="1100" y2="484" stroke="#111418" stroke-width="1.4"/>
    <!-- Compartiment du tableau : les attributs -->
    <line x1="780" y1="484" x2="780" y2="700" stroke="#111418" stroke-width="1.4"/>
    <line x1="420" y1="592" x2="780" y2="592" stroke="#C4CAD2" stroke-width="1"/>
    <text x="444" y="547" font-family="IBM Plex Sans" font-weight="400" font-size="26" fill="#111418">Usage : eau potable</text>
    <text x="444" y="655" font-family="IBM Plex Sans" font-weight="400" font-size="26" fill="#111418">Matériau : fonte</text>
    <!-- Compartiment du cartouche « Repère » : le système de coordonnées -->
    <text x="800" y="516" font-family="Azeret Mono" font-weight="400" font-size="24" fill="#4A525D">Repère</text>
    <line x1="780" y1="528" x2="1100" y2="528" stroke="#111418" stroke-width="1.4"/>
    <circle cx="940" cy="614" r="60" fill="none" stroke="#111418" stroke-width="1.6"/>
    <path d="M940,554 A30,60 0 0 0 940,674 A30,60 0 0 0 940,554" fill="none" stroke="#4A525D" stroke-width="1"/>
    <line x1="880" y1="614" x2="1000" y2="614" stroke="#4A525D" stroke-width="1"/>
    <circle cx="958" cy="594" r="5" fill="#111418"/>
    <!-- Contour principal de la carte, par-dessus les filets -->
    <rect x="420" y="140" width="680" height="560" fill="none" stroke="#111418" stroke-width="3" stroke-linejoin="miter"/>
  </g>

  <!-- Ports de parties, ouverts avec leur nom, et boîtes de nom -->
  <g id="theme3-geometrie">
    <rect x="96" y="320" width="280" height="48" fill="#FFFFFF" stroke="#111418" stroke-width="1.4"/>
    <text x="236" y="353" text-anchor="middle" font-family="Azeret Mono" font-weight="400" font-size="26" fill="#111418">Géométrie</text>
    <line x1="376" y1="344" x2="413" y2="344" stroke="#111418" stroke-width="1.2"/>
    <rect x="413" y="337" width="14" height="14" fill="#FFFFFF" stroke="#111418" stroke-width="1.6"/>
  </g>
  <g id="theme3-attributs">
    <rect x="96" y="568" width="280" height="48" fill="#FFFFFF" stroke="#111418" stroke-width="1.4"/>
    <text x="236" y="601" text-anchor="middle" font-family="Azeret Mono" font-weight="400" font-size="26" fill="#111418">Attributs</text>
    <line x1="376" y1="592" x2="413" y2="592" stroke="#111418" stroke-width="1.2"/>
    <rect x="413" y="585" width="14" height="14" fill="#FFFFFF" stroke="#111418" stroke-width="1.6"/>
  </g>
  <g id="theme3-systeme">
    <line x1="940" y1="707" x2="940" y2="740" stroke="#111418" stroke-width="1.2"/>
    <rect x="933" y="693" width="14" height="14" fill="#FFFFFF" stroke="#111418" stroke-width="1.6"/>
    <rect x="620" y="740" width="400" height="48" fill="#FFFFFF" stroke="#111418" stroke-width="1.4"/>
    <text x="820" y="773" text-anchor="middle" font-family="Azeret Mono" font-weight="400" font-size="26" fill="#111418">Système de coordonnées</text>
  </g>

  <!-- Accolade cyan à angles vifs : « se lit donc dans deux parties » -->
  <path id="theme3-accolade" d="M1114,204 H1130 V444 L1146,452 L1130,460 V700 H1114" fill="none" stroke="#0096C7" stroke-width="1.6" stroke-linejoin="miter" stroke-linecap="butt"/>

  <!-- Mise en évidence unique, état final : le cartouche (« la rattache à la Terre ») -->
  <g id="theme3-evidence">
    <rect x="772" y="476" width="336" height="232" fill="none" stroke="#1F6BFF" stroke-width="1.6" stroke-dasharray="8 6"/>
    <rect x="767" y="471" width="10" height="10" fill="#1F6BFF"/>
    <rect x="1103" y="471" width="10" height="10" fill="#1F6BFF"/>
    <rect x="767" y="703" width="10" height="10" fill="#1F6BFF"/>
    <rect x="1103" y="703" width="10" height="10" fill="#1F6BFF"/>
  </g>

  <!-- Panneau de choix (composant du lecteur), a sélectionné, conséquence de a -->
  <g id="theme3-choix">
    <rect x="1206" y="128" width="624" height="560" fill="#111418" fill-opacity="0.08"/>
    <rect x="1200" y="120" width="624" height="560" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.4"/>
    <text font-family="IBM Plex Sans" font-weight="600" font-size="28" fill="#111418">
      <tspan x="1224" y="176">Quelle partie de cette donnée</tspan>
      <tspan x="1224" y="212">situe la conduite sur la Terre&#160;?</tspan>
    </text>
    <!-- a : sélectionné (bord plein et poignées bleues, pas une mise en évidence) -->
    <rect x="1224" y="244" width="576" height="64" fill="#FFFFFF" stroke="#1F6BFF" stroke-width="2"/>
    <rect x="1219" y="239" width="10" height="10" fill="#1F6BFF"/>
    <rect x="1795" y="239" width="10" height="10" fill="#1F6BFF"/>
    <rect x="1219" y="303" width="10" height="10" fill="#1F6BFF"/>
    <rect x="1795" y="303" width="10" height="10" fill="#1F6BFF"/>
    <text x="1248" y="285" font-family="Azeret Mono" font-weight="400" font-size="24" fill="#5E6773">a</text>
    <text x="1288" y="285" font-family="IBM Plex Sans" font-weight="400" font-size="26" fill="#111418">Le tracé de la conduite</text>
    <!-- b -->
    <rect x="1224" y="324" width="576" height="64" fill="#FFFFFF" stroke="#C4CAD2" stroke-width="1.4"/>
    <text x="1248" y="365" font-family="Azeret Mono" font-weight="400" font-size="24" fill="#5E6773">b</text>
    <text x="1288" y="365" font-family="IBM Plex Sans" font-weight="400" font-size="26" fill="#111418">L'usage et le matériau</text>
    <!-- c -->
    <rect x="1224" y="404" width="576" height="64" fill="#FFFFFF" stroke="#C4CAD2" stroke-width="1.4"/>
    <text x="1248" y="445" font-family="Azeret Mono" font-weight="400" font-size="24" fill="#5E6773">c</text>
    <text x="1288" y="445" font-family="IBM Plex Sans" font-weight="400" font-size="26" fill="#111418">Le repère du cartouche</text>
    <!-- Conséquence de a, sans verdict -->
    <rect x="1224" y="492" width="576" height="164" fill="#F4F6F8" stroke="#D5DAE1" stroke-width="1.4"/>
    <rect x="1224" y="492" width="4" height="164" fill="#4A525D"/>
    <text font-family="IBM Plex Sans" font-weight="400" font-size="24" fill="#111418">
      <tspan x="1248" y="530">Le tracé est la géométrie : il porte</tspan>
      <tspan x="1248" y="564">l'information de position de la conduite.</tspan>
      <tspan x="1248" y="598">Seul, il ne dit pas où cette position se</tspan>
      <tspan x="1248" y="632">trouve sur la Terre.</tspan>
    </text>
  </g>
</svg>
