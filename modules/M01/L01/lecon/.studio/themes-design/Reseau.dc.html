<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Thème 3 · Plan de réseau</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5CAD}a:hover{color:#063F78}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Overpass', sans-serif; color: #111111">
  <h1 style="position: absolute; left: 112px; top: 76px; margin: 0; font-size: 66px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Un moteur au centre.</h1>

  <svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position: absolute; left: 0; top: 0" aria-hidden="true">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="8">
      <path d="{{l.d}}" fill="none" stroke="{{l.color}}" stroke-width="14" stroke-linejoin="round" stroke-linecap="butt"></path>
    </sc-for>
  </svg>

  <sc-for list="{{lines}}" as="l" hint-placeholder-count="8">
    <div style="position: absolute; left: {{l.sx}}px; top: {{l.sy}}px; width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 8px solid {{l.color}}"></div>
  </sc-for>

  <div style="position: absolute; left: 878px; top: 448px; width: 164px; height: 104px; box-sizing: border-box; border: 3px dashed #111111; border-radius: 52px"></div>
  <div style="position: absolute; left: 892px; top: 462px; width: 136px; height: 76px; box-sizing: border-box; border: 8px solid #111111; border-radius: 38px; background: #FFFFFF"></div>
  <div style="position: absolute; left: 1052px; top: 400px; font-weight: 800; font-size: 40px; letter-spacing: 0.04em; text-transform: uppercase; background: #FFFFFF; padding: 4px 10px">Moteur</div>

  <div style="position: absolute; left: 1480px; top: 76px; width: 330px; box-sizing: border-box; padding: 20px 22px; border: 3px solid #111111; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 16px">
    <div style="display: flex; align-items: center; flex-shrink: 0">
      <div style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 6px solid #111111"></div>
      <div style="width: 30px; height: 10px; background: #111111"></div>
    </div>
    <span style="font-weight: 600; font-size: 26px; line-height: 1.15">Formats pris en charge</span>
  </div>

  <a href="https://docs.safe.com/fme/html/FME-Form-Documentation/FME-Form/Workbench/What_is_FME.htm" style="position: absolute; left: 1360px; top: 866px; font-size: 24px; font-weight: 600">D'après Safe Software</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var cx = 960, cy = 500;
    var ends = [[960, 196], [1300, 236], [1440, 500], [1300, 764], [960, 804], [620, 764], [480, 500], [620, 236]];
    var colors = ['#D7263D', '#0B5CAD', '#1B9E4B', '#F2A900', '#7B3FA0', '#00918E', '#E8650A', '#6D4C2F'];
    var lines = ends.map(function (e, i) {
      var sx = e[0], sy = e[1];
      var dx = cx - sx, dy = cy - sy;
      var adx = Math.abs(dx), ady = Math.abs(dy);
      var d = 'M' + sx + ' ' + sy;
      if (adx > ady) {
        d += ' L' + (sx + Math.sign(dx) * (adx - ady)) + ' ' + sy;
      } else if (ady > adx) {
        d += ' L' + sx + ' ' + (sy + Math.sign(dy) * (ady - adx));
      }
      d += ' L' + cx + ' ' + cy;
      return { d: d, color: colors[i], sx: sx - 20, sy: sy - 20 };
    });
    return { lines: lines };
  }
}
</script>
</body>
</html>
