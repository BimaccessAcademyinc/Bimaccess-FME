<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Thème 4 · Télédétection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DD3FC}a:hover{color:#BAE6FD}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0A1119; font-family: 'Space Grotesk', sans-serif; color: #E5EDF5">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position: absolute; left: 0; top: 0" aria-hidden="true">
    <path d="{{graticule}}" fill="none" stroke="#16232F" stroke-width="1"></path>
    <path d="{{ticks}}" fill="none" stroke="#3A4C5E" stroke-width="2"></path>
    <path d="{{writes}}" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"></path>
    <path d="{{writes}}" fill="none" stroke="#5EEAD4" stroke-width="1" opacity="0.6"></path>
    <path d="{{read}}" fill="none" stroke="#FBBF24" stroke-width="3"></path>
  </svg>

  <h1 style="position: absolute; left: 112px; top: 76px; margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; color: #F8FAFC">Un moteur au centre.</h1>

  <sc-for list="{{tiles}}" as="t" hint-placeholder-count="8">
    <div style="position: absolute; left: {{t.left}}px; top: {{t.top}}px; width: 152px; height: 106px; box-sizing: border-box; padding: 2px; background: #0A1119; border: 1px solid {{t.frame}}">
      <div style="width: 146px; height: 100px; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); grid-template-rows: repeat(7, minmax(0, 1fr))">
        <sc-for list="{{t.cells}}" as="c" hint-placeholder-count="70">
          <div style="background: {{c}}"></div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <div style="position: absolute; left: 880px; top: 420px; width: 160px; height: 160px; box-sizing: border-box; border: 2px dashed #E2E8F0"></div>
  <svg width="132" height="132" viewBox="0 0 132 132" style="position: absolute; left: 894px; top: 434px" role="img" aria-label="Réticule : le moteur">
    <circle cx="66" cy="66" r="56" fill="#0A1119" stroke="#5EEAD4" stroke-width="2.5"></circle>
    <circle cx="66" cy="66" r="30" fill="none" stroke="#5EEAD4" stroke-width="2"></circle>
    <circle cx="66" cy="66" r="5" fill="#5EEAD4"></circle>
    <path d="M66 0 V24 M66 108 V132 M0 66 H24 M108 66 H132" stroke="#5EEAD4" stroke-width="2.5"></path>
  </svg>
  <div style="position: absolute; left: 860px; top: 596px; width: 200px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.22em; text-transform: uppercase; color: #5EEAD4">Moteur</div>

  <div style="position: absolute; left: 1470px; top: 76px; width: 338px; box-sizing: border-box; padding: 18px 20px; border: 1px solid #2B3A48; background: rgba(10, 17, 25, 0.85); display: flex; align-items: center; gap: 16px">
    <div style="width: 52px; height: 36px; flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid #3A4C5E">
      <div style="background: #7F1D1D"></div><div style="background: #DC2626"></div><div style="background: #15803D"></div><div style="background: #4ADE80"></div>
      <div style="background: #1E3A8A"></div><div style="background: #F59E0B"></div><div style="background: #A3A3A3"></div><div style="background: #525252"></div>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 24px; line-height: 1.2; color: #CBD5E1">Formats pris en charge</span>
  </div>

  <a href="https://docs.safe.com/fme/html/FME-Form-Documentation/FME-Form/Workbench/What_is_FME.htm" style="position: absolute; left: 1360px; top: 866px; font-family: 'JetBrains Mono', monospace; font-size: 24px">D'après Safe Software</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var cx = 960, cy = 500, rx = 440, ry = 290, n = 8;
    var palettes = [
      ['#7F1D1D', '#B91C1C', '#DC2626', '#F87171', '#14532D', '#166534'],
      ['#052E16', '#14532D', '#15803D', '#22C55E', '#86EFAC', '#A16207'],
      ['#1E1B4B', '#312E81', '#7C3AED', '#F59E0B', '#FDE047', '#FFF7ED'],
      ['#171717', '#262626', '#404040', '#737373', '#A3A3A3', '#E5E5E5'],
      ['#0C4A6E', '#0369A1', '#38BDF8', '#BAE6FD', '#F0F9FF', '#075985'],
      ['#3F2A14', '#78350F', '#B45309', '#D97706', '#FCD34D', '#365314'],
      ['#4A044E', '#86198F', '#C026D3', '#F0ABFC', '#0F766E', '#2DD4BF'],
      ['#1C1917', '#44403C', '#78716C', '#A8A29E', '#15803D', '#0E7490']
    ];
    var tiles = [], writes = '', read = '';
    for (var i = 0; i < n; i++) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      var x = Math.round(cx + rx * Math.cos(a)), y = Math.round(cy + ry * Math.sin(a));
      var cells = [], p = palettes[i];
      for (var r = 0; r < 7; r++) {
        for (var c = 0; c < 10; c++) {
          var v = Math.sin(c * 0.9 + i * 1.7) + Math.cos(r * 1.1 - i) + 0.6 * Math.sin((c + r) * 1.9 + i * 3.1);
          var idx = Math.max(0, Math.min(p.length - 1, Math.floor((v + 2.6) / 5.2 * p.length)));
          cells.push(p[idx]);
        }
      }
      var isRead = i === 6;
      tiles.push({ left: x - 76, top: y - 53, cells: cells, frame: isRead ? '#FBBF24' : '#2B3A48' });
      var seg = 'M' + x + ' ' + y + ' L' + cx + ' ' + cy;
      if (isRead) { read = seg; } else { writes += seg + ' '; }
    }
    var graticule = '', ticks = '';
    for (var gx = 80; gx < 1920; gx += 80) { graticule += 'M' + gx + ' 0 V1080 '; ticks += 'M' + gx + ' 0 V12 M' + gx + ' 1068 V1080 '; }
    for (var gy = 60; gy < 1080; gy += 80) { graticule += 'M0 ' + gy + ' H1920 '; ticks += 'M0 ' + gy + ' H12 M1908 ' + gy + ' H1920 '; }
    return { tiles: tiles, writes: writes, read: read, graticule: graticule, ticks: ticks };
  }
}
</script>
</body>
</html>
