<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Thème 2 · Atelier de flux</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background-color: #F5F6F8; background-image: radial-gradient(#D5D9E0 1.4px, transparent 1.4px); background-size: 28px 28px; font-family: 'Inter', sans-serif; color: #111827">
  <h1 style="position: absolute; left: 112px; top: 76px; margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.025em; line-height: 1">Un moteur au centre.</h1>

  <div style="position: absolute; left: 400px; top: 168px; width: 1120px; height: 680px; box-sizing: border-box; border: 2px dashed #A9B1BE; border-radius: 28px; background: rgba(255, 255, 255, 0.35)"></div>
  <div style="position: absolute; left: 432px; top: 148px; padding: 8px 16px; background: #E4E8EE; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 24px; color: #374151">Formats pris en charge</div>

  <svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position: absolute; left: 0; top: 0" aria-hidden="true">
    <path d="{{writes}}" fill="none" stroke="#E8710A" stroke-width="4" stroke-linecap="round"></path>
    <path d="{{read}}" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"></path>
  </svg>

  <sc-for list="{{nodes}}" as="n" hint-placeholder-count="8">
    <div style="position: absolute; left: {{n.left}}px; top: {{n.top}}px; width: 176px; height: 76px; box-sizing: border-box; padding: 14px 16px; background: #FFFFFF; border: 1.5px solid {{n.border}}; border-radius: 14px; box-shadow: 0 2px 6px rgba(17, 24, 39, 0.08); display: flex; align-items: center; gap: 14px">
      <svg width="34" height="42" viewBox="0 0 34 42" aria-hidden="true" style="flex-shrink: 0">
        <path d="M3 3 H22 L31 12 V39 H3 Z" fill="#F3F4F6" stroke="#4B5563" stroke-width="2" stroke-linejoin="round"></path>
        <path d="M22 3 V12 H31" fill="none" stroke="#4B5563" stroke-width="2" stroke-linejoin="round"></path>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 7px; flex-grow: 1">
        <div style="height: 8px; border-radius: 4px; background: #9CA3AF; width: 86%"></div>
        <div style="height: 8px; border-radius: 4px; background: #D1D5DB; width: 62%"></div>
      </div>
    </div>
    <div style="position: absolute; left: {{n.portX}}px; top: {{n.portY}}px; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 3px solid {{n.port}}"></div>
  </sc-for>

  <div style="position: absolute; left: 818px; top: 418px; width: 284px; height: 164px; box-sizing: border-box; border: 2.5px dashed #111827; border-radius: 26px"></div>
  <div style="position: absolute; left: 830px; top: 430px; width: 260px; height: 140px; box-sizing: border-box; border-radius: 18px; background: #16213A; box-shadow: 0 6px 18px rgba(22, 33, 58, 0.25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="8" fill="none" stroke="#93C5FD" stroke-width="3"></circle>
      <path d="M22 2 V10 M22 34 V42 M2 22 H10 M34 22 H42 M8 8 L13.5 13.5 M30.5 30.5 L36 36 M36 8 L30.5 13.5 M13.5 30.5 L8 36" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"></path>
    </svg>
    <span style="font-size: 38px; font-weight: 600; color: #FFFFFF; letter-spacing: -0.01em">Moteur</span>
  </div>

  <a href="https://docs.safe.com/fme/html/FME-Form-Documentation/FME-Form/Workbench/What_is_FME.htm" style="position: absolute; left: 1360px; top: 870px; font-size: 24px; font-weight: 500">D'après Safe Software</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var cx = 960, cy = 500, rx = 420, ry = 260, n = 8;
    var nodes = [], writes = '', read = '';
    for (var i = 0; i < n; i++) {
      var a = Math.PI + i * 2 * Math.PI / n;
      var x = Math.round(cx + rx * Math.cos(a)), y = Math.round(cy + ry * Math.sin(a));
      var left = x - 88, top = y - 38;
      var side = Math.abs(x - cx) < 40 ? (y < cy ? 'bottom' : 'top') : (x < cx ? 'right' : 'left');
      var px = side === 'right' ? left + 176 : side === 'left' ? left : x;
      var py = side === 'bottom' ? top + 76 : side === 'top' ? top : y;
      var isRead = i === 0;
      var hx = side === 'right' ? 830 : side === 'left' ? 1090 : cx;
      var hy = side === 'bottom' ? 430 : side === 'top' ? 570 : cy;
      var d;
      if (side === 'right' || side === 'left') {
        var mx = (px + hx) / 2;
        d = 'M' + px + ' ' + py + ' C' + mx + ' ' + py + ' ' + mx + ' ' + hy + ' ' + hx + ' ' + hy;
      } else {
        var my = (py + hy) / 2;
        d = 'M' + px + ' ' + py + ' C' + px + ' ' + my + ' ' + hx + ' ' + my + ' ' + hx + ' ' + hy;
      }
      if (isRead) { read = d; } else { writes += d + ' '; }
      nodes.push({
        left: left, top: top,
        portX: px - 8, portY: py - 8,
        port: isRead ? '#2563EB' : '#E8710A',
        border: isRead ? '#2563EB' : '#D1D5DB'
      });
    }
    return { nodes: nodes, writes: writes, read: read };
  }
}
</script>
</body>
</html>
