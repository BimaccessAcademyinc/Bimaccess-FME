<!doctype html>
<html lang="fr">

</head>
<body>
<x-dc>

<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #F1F3EC; font-family: 'Source Serif 4', serif; color: #23281F">

    <path d="{{roads}}" fill="none" stroke="#23281F" stroke-width="11" stroke-linecap="round"></path>
    <path d="{{roads}}" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"></path>
    <path d="{{roads}}" fill="none" stroke="#C4472B" stroke-width="4" stroke-linecap="round"></path>
    <path d="{{readRoad}}" fill="none" stroke="#23281F" stroke-width="13" stroke-linecap="round"></path>
    <path d="{{readRoad}}" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"></path>
    <path d="{{readRoad}}" fill="none" stroke="#2F6DA8" stroke-width="5" stroke-linecap="round"></path>
    <rect x="34" y="34" width="1852" height="1012" fill="none" stroke="#23281F" stroke-width="2"></rect>
    <path d="{{border}}" fill="#23281F"></path>
    <rect x="46" y="46" width="1828" height="988" fill="none" stroke="#23281F" stroke-width="1.2"></rect>
    <rect x="58" y="58" width="1804" height="964" fill="none" stroke="#23281F" stroke-width="0.8"></rect>
  </svg>

  <div style="position: absolute; left: 104px; top: 84px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 66px; font-weight: 600; letter-spacing: -0.01em; line-height: 1">Un moteur au centre.</h1>
    <div style="width: 300px; height: 0; border-top: 2px solid #23281F; border-bottom: 0.8px solid #23281F; padding-top: 3px"></div>
  </div>

  <sc-for list="{{sheets}}" as="s" hint-placeholder-count="8">
    <div style="position: absolute; left: {{s.left}}px; top: {{s.top}}px; width: 150px; height: 98px; box-sizing: border-box; background: #FBFCF8; border: 2px solid #23281F; outline: 1px solid #23281F; outline-offset: 3px">
      <svg width="146" height="94" viewBox="0 0 146 94" aria-hidden="true" style="display: block">
        <path d="{{s.g}}" fill="#D3DFC3" stroke="#6E8B4E" stroke-width="1.2"></path>
        <path d="{{s.gd}}" fill="#6E8B4E"></path>
        <path d="{{s.c}}" fill="none" stroke="#B08A62" stroke-width="1.4"></path>
        <path d="{{s.wf}}" fill="#BFD5E6" stroke="#2F6DA8" stroke-width="1.4"></path>
        <path d="{{s.w}}" fill="none" stroke="#2F6DA8" stroke-width="2.4" stroke-linecap="round"></path>
        <path d="{{s.k}}" fill="none" stroke="#23281F" stroke-width="1.3"></path>
        <path d="{{s.r}}" fill="none" stroke="#C4472B" stroke-width="3" stroke-linecap="round"></path>
        <path d="{{s.f}}" fill="#23281F"></path>
        <path d="{{s.px}}" fill="#9DAF8A"></path>
        <path d="{{s.px2}}" fill="#5F7550"></path>
      </svg>
    </div>
  </sc-for>

  <div style="position: absolute; left: 908px; top: 450px; width: 104px; height: 104px; border: 2px dashed #2F6DA8; border-radius: 50%; box-sizing: border-box"></div>
  <svg width="68" height="62" viewBox="0 0 68 62" style="position: absolute; left: 926px; top: 466px" role="img" aria-label="Point géodésique : le moteur">
    <path d="M34 4 L64 58 H4 Z" fill="#FBFCF8" stroke="#23281F" stroke-width="3" stroke-linejoin="miter"></path>
    <circle cx="34" cy="40" r="5.5" fill="#23281F"></circle>
  </svg>
  <div style="position: absolute; left: 850px; top: 562px; width: 220px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 0.3em; text-transform: uppercase; background: #F1F3EC; padding: 2px 0">Moteur</div>

  <div style="position: absolute; left: 1448px; top: 84px; width: 364px; box-sizing: border-box; background: #FBFCF8; border: 2px solid #23281F; outline: 0.8px solid #23281F; outline-offset: 4px">
    <div style="padding: 10px 22px; border-bottom: 1.2px solid #23281F; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.32em; text-transform: uppercase">Légende</div>
    <div style="padding: 18px 22px 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; gap: 18px">
        <div style="width: 54px; height: 36px; box-sizing: border-box; border: 2px solid #23281F; outline: 1px solid #23281F; outline-offset: 2px; background: #FBFCF8; flex-shrink: 0"></div>
        <span style="font-style: italic; font-size: 27px; line-height: 1.15">Formats pris en charge</span>
      </div>
      <div style="display: flex; align-items: center; gap: 18px">
        <svg width="54" height="40" viewBox="0 0 54 40" aria-hidden="true" style="flex-shrink: 0">
          <path d="M27 4 L48 36 H6 Z" fill="#FBFCF8" stroke="#23281F" stroke-width="2.5"></path>
          <circle cx="27" cy="26" r="4" fill="#23281F"></circle>
        </svg>
        <span style="font-style: italic; font-size: 27px; line-height: 1.15">Moteur</span>
      </div>
    </div>
  </div>

  <svg width="300" height="34" viewBox="0 0 300 34" style="position: absolute; left: 1480px; top: 318px" aria-hidden="true">
    <rect x="2" y="12" width="290" height="12" fill="#FBFCF8" stroke="#23281F" stroke-width="1.5"></rect>
    <path d="M2 12 H60 V24 H2 Z M118 12 H176 V24 H118 Z M234 12 H292 V24 H234 Z" fill="#23281F"></path>
    <path d="M2 4 V32 M60 6 V30 M118 6 V30 M176 6 V30 M234 6 V30 M292 4 V32" stroke="#23281F" stroke-width="1.5"></path>
  </svg>

  <svg width="116" height="116" viewBox="0 0 116 116" style="position: absolute; left: 1712px; top: 700px" aria-hidden="true">
    <circle cx="58" cy="58" r="40" fill="none" stroke="#23281F" stroke-width="1.2"></circle>
    <circle cx="58" cy="58" r="33" fill="none" stroke="#23281F" stroke-width="0.6"></circle>
    <path d="M58 4 L67 58 L58 112 L49 58 Z" fill="none" stroke="#23281F" stroke-width="1.6"></path>
    <path d="M58 4 L67 58 L49 58 Z" fill="#23281F"></path>
    <path d="M4 58 L58 51 L112 58 L58 65 Z" fill="none" stroke="#23281F" stroke-width="1.2"></path>
    <path d="M4 58 L58 51 L58 65 Z" fill="#23281F"></path>
  </svg>

  <div style="position: absolute; left: 1360px; top: 858px; display: flex; flex-direction: column; gap: 4px">
    <div style="width: 220px; border-top: 1px solid #23281F"></div>
    <a href="https://docs.safe.com/fme/html/FME-Form-Documentation/FME-Form/Workbench/What_is_FME.htm" style="font-style: italic; font-size: 24px">D'après Safe Software</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var cx = 960, cy = 500, rx = 430, ry = 290, n = 8;
    function line(pts) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' '); }
    function wave(y0, amp, f, ph) { var p = []; for (var k = 0; k <= 22; k++) { p.push([k * 6.64, y0 + amp * Math.sin(k * f + ph)]); } return line(p); }
    function rects(list) { return list.map(function (r) { return 'M' + r[0] + ' ' + r[1] + ' h' + r[2] + ' v' + r[3] + ' h-' + r[2] + ' Z'; }).join(' '); }
    function dots(list, rad) { return list.map(function (d) { return 'M' + (d[0] - rad) + ' ' + d[1] + ' a' + rad + ' ' + rad + ' 0 1 0 ' + (2 * rad) + ' 0 a' + rad + ' ' + rad + ' 0 1 0 -' + (2 * rad) + ' 0 Z'; }).join(' '); }
    var minis = [
      { c: wave(22, 7, 0.5, 0) + ' ' + wave(40, 9, 0.45, 1) + ' ' + wave(58, 10, 0.4, 2) + ' ' + wave(76, 8, 0.5, 3) },
      { w: 'M0 70 C30 60 40 30 70 36 S110 70 146 52', wf: 'M92 14 C104 6 124 10 126 22 C128 34 108 38 98 32 C90 28 86 20 92 14 Z' },
      { k: 'M0 30 L58 24 L64 94 M58 24 L54 0 M64 60 L146 54 M100 0 L104 94 M0 66 L64 60' },
      { f: rects([[14, 14, 22, 16], [44, 12, 14, 22], [20, 46, 30, 14], [70, 20, 18, 18], [96, 14, 30, 12], [78, 52, 24, 22], [112, 46, 18, 30], [30, 70, 20, 14]]) },
      { r: 'M0 64 C40 60 60 40 90 38 S130 22 146 20 M60 94 C64 70 70 54 90 38' },
      { g: 'M10 16 C30 4 60 10 66 28 C72 46 40 56 22 48 C8 42 0 28 10 16 Z M86 44 C104 34 136 40 138 60 C140 80 110 88 94 80 C80 72 74 54 86 44 Z', gd: dots([[24, 24], [40, 20], [50, 34], [30, 38], [100, 56], [118, 52], [112, 70], [96, 68], [126, 66]], 2.4) },
      { f: dots([[22, 22], [60, 40], [104, 18], [36, 70], [92, 66], [126, 50], [74, 16]], 4.2) },
      { px: rects([[0, 0, 24, 24], [48, 0, 24, 24], [96, 0, 24, 24], [24, 24, 24, 24], [72, 24, 24, 24], [120, 24, 26, 24], [0, 48, 24, 24], [48, 48, 24, 24], [96, 48, 24, 24], [24, 72, 24, 22], [72, 72, 24, 22], [120, 72, 26, 22]]), px2: rects([[24, 0, 24, 24], [0, 24, 24, 24], [96, 24, 24, 24], [72, 48, 24, 24], [0, 72, 24, 22], [120, 48, 26, 24]]) }
    ];
    var sheets = [], roads = '', readRoad = '';
    for (var i = 0; i < n; i++) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      var x = Math.round(cx + rx * Math.cos(a)), y = Math.round(cy + ry * Math.sin(a));
      var m = minis[i];
      sheets.push({ left: x - 75, top: y - 49, c: m.c || '', w: m.w || '', wf: m.wf || '', k: m.k || '', r: m.r || '', f: m.f || '', g: m.g || '', gd: m.gd || '', px: m.px || '', px2: m.px2 || '' });
      var seg = 'M' + x + ' ' + y + ' L' + cx + ' ' + cy;
      if (i === 6) { readRoad = seg; } else { roads += seg + ' '; }
    }
    function ring(scale, k) {
      var d = '';
      for (var j = 0; j <= 96; j++) {
        var t = j / 96 * Math.PI * 2;
        var w = 1 + 0.06 * Math.sin(3 * t + k) + 0.035 * Math.sin(5 * t - 2 * k) + 0.02 * Math.sin(9 * t + k * 0.7);
        var px = cx + 1.18 * rx * scale * w * Math.cos(t), py = cy + 1.18 * ry * scale * w * Math.sin(t);
        d += (j ? 'L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1);
      }
      return d + 'Z ';
    }
    var contours = '', contoursMajor = '';
    for (var k = 1; k <= 10; k++) {
      var r = ring(k * 0.11, k);
      if (k % 5 === 0) { contoursMajor += r; } else { contours += r; }
    }
    var border = '', step = 76;
    for (var bx = 46, b = 0; bx < 1874; bx += step, b++) {
      if (b % 2 === 0) {
        var bw = Math.min(step, 1874 - bx);
        border += 'M' + bx + ' 34 h' + bw + ' v12 h-' + bw + ' Z M' + bx + ' 1034 h' + bw + ' v12 h-' + bw + ' Z ';
      }
    }
    for (var by = 46, c2 = 0; by < 1034; by += step, c2++) {
      if (c2 % 2 === 0) {
        var bh = Math.min(step, 1034 - by);
        border += 'M34 ' + by + ' h12 v' + bh + ' h-12 Z M1874 ' + by + ' h12 v' + bh + ' h-12 Z ';
      }
    }
    var crosses = '';
    for (var gx = 274; gx < 1860; gx += 228) {
      for (var gy = 236; gy < 1020; gy += 228) {
        crosses += 'M' + (gx - 8) + ' ' + gy + ' h16 M' + gx + ' ' + (gy - 8) + ' v16 ';
      }
    }
    return { sheets: sheets, roads: roads, readRoad: readRoad, contours: contours, contoursMajor: contoursMajor, border: border, crosses: crosses };
  }
}
</script>
