lacunes:
  - question: Q5
    manque: "Lieu de la fondation en 1993 non trouvé sur une page ouverte (Surrey n'est attesté que comme siège en 2018). Noms des fondateurs : aucune page de l'éditeur ouverte ne les donne. À sourcer."
  - question: Q5
    manque: "Parcours de Dale Lutz avant la fondation : seul le passage commun chez MDA est attesté. À sourcer."
  - question: Q6
    manque: "Nom exact du client de départ (ministère, organisme) non trouvé ; les sources disent « gouvernement canadien » / « BC Government » sans ministère. À sourcer."
  - question: Q7
    manque: "Organisme précis derrière SAIF au-delà de « BC Government », et prononciation « safe » du sigle sur une page ouverte de l'éditeur. À sourcer."
  - question: Q8
    manque: "Étapes datées entre 1996 et 1997 (premières versions numérotées, partenariats) non trouvées ; les pages business-in-vancouver (403) et fiche PDF de l'éditeur (illisible) n'ont pu être exploitées."
