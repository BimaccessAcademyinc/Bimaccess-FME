  question: Q2
  enonce: Safe Software présente FME comme l'acronyme de « Feature Manipulation Engine » ; sa documentation actuelle écrit
    que FME était « à l'origine » le Feature Manipulation Engine.
  usage: narration
  sources:
  - url: https://docs.safe.com/fme/html/FME-Form-Documentation/FME-Form/Workbench/What_is_FME.htm
    titre: What is FME (FME Form 2026.3)
    editeur: Safe Software
    niveau: A
    consulte: 2026-11-26
    extrait: FME (originally, the “Feature Manipulation Engine”) was designed to overcome many of the problems
  - url: https://cdn.safe.com/resources/brochures/SafeSoftware-FactSheet.pdf
    titre: Safe Software FactSheet (date non lue)
    editeur: Safe Software
    niveau: A
    consulte: 2026-11-26
    extrait: Safe Software’s data integration platform, FME (Feature Manipulation Engine) is trusted by over 10,000 organizations
      in 128 countries.
  - url: https://techcouver.com/2024/10/11/vancouver-tech-anchor-safe-software-ready-for-next-chapter-of-growth/
    titre: Vancouver tech anchor Safe Software ready for next chapter of growth (Techcouver, 11 oct. 2024)
    editeur: Techcouver
    niveau: B
    consulte: &id001 2026-11-26
    extrait: The BC firm's flagship product is the Feature Manipulation Engine, or FME.
  - url: https://www.nsnews.com/technology/don-murray-is-going-for-growth-as-safe-softwares-ceo-9631940
