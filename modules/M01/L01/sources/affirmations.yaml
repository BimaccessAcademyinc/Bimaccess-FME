    est abandonnée.'
- id: A-nom-05
  question: Q2
  enonce: La documentation de Safe Software nomme ses produits actuels « FME Form » (version 2026.3) ; le nom du produit n'y
    est plus « Feature Manipulation Engine » mais FME, l'expansion étant rappelée comme nom d'origine.
  usage: contexte
  sources:
