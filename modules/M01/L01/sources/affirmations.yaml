- id: A-nom-16
  question: Q1
  enonce: Dans le vocabulaire des normes de l'information géographique, une feature est l'abstraction d'un phénomène (ou d'une
    entité) du monde réel.
  usage: narration
  sources:
  - url: https://docs.ogc.org/as/17-087r13/17-087r13.html
    titre: 'OGC Abstract Specification, Features and geometry – Part 1: Feature models (17-087r13, approuvé 2019-03-19)'
    editeur: OGC
    niveau: A
    consulte: *id001
    extrait: abstraction of real-world phenomena or entity
  - url: https://www.w3.org/2015/spatial/track/issues/190
    titre: 'ISSUE-190: SDW BP Glossary Issue: Features (cite la définition ISO 19101)'
    editeur: W3C
    niveau: B
    consulte: *id001
    extrait: 'Feature: Abstraction of a real world phenomenon.'
  contradictions: []
  verifie: true
  note_verification: 'Deux formulations : OGC 17-087r13 (« phenomena or entity », définition 4.7 marquée 〈geographic information〉)
    et ISO 19101 citée par le W3C (« a real world phenomenon »). L''énoncé garde le tronc commun. Vérification : définition
    4.7 de 17-087r13 (〈geographic information〉) et citation ISO 19101 du W3C ; le tronc commun est fidèle.'
- id: A-origines-01
  question: Q5
  enonce: Safe Software a été officiellement constituée en société le 13 décembre 1993.
  usage: expert
  sources:
  - url: https://fme.safe.com/blog/2013/12/20-years-ago-today/
    titre: It was 20 years ago today…
    editeur: Safe Software
