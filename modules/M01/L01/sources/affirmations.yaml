    part l'avoir abandonné.
- id: A-nom-06
  question: Q3
  enonce: Dans la documentation FME, la géométrie représente l'information de position d'une feature, et peut se composer
    de points, de lignes ou de surfaces ; des features sans géométrie existent aussi.
  usage: expert
  sources:
  - url: https://docs.safe.com/fme/html/FME-Form-Documentation/FME-ReadersWriters/aboutFeatures/feature-type-attributes-about.htm
    titre: About Feature Type Attributes (FME Readers and Writers 2026.3)
    editeur: Safe Software
    niveau: A
    consulte: 2026-11-26
    extrait: The Geometry class represents a feature's positional information.
  - url: https://docs.safe.com/fme/html/FME-Form-Documentation/FME-ReadersWriters/aboutFeatures/feature-type-attributes-about.htm
    titre: About Feature Type Attributes (FME Readers and Writers 2026.3)
    editeur: Safe Software
    niveau: A
    consulte: 2026-11-26
    extrait: Feature geometry may consist of points, lines, or areas.
  - url: https://docs.safe.com/fme/html/FME-Form-Documentation/FME-ReadersWriters/aboutFeatures/feature-type-attributes-about.htm
    titre: About Feature Type Attributes (FME Readers and Writers 2026.3)
    editeur: Safe Software
    niveau: A
    consulte: 2026-11-26
    extrait: Features with no geometry are also supported.
  contradictions: []
  verifie: null
  repare: true
  note_verification: 'Vérification : l''extrait ne porte que l''information de position. Points, lignes, surfaces et features
    sans géométrie sont sur la page (« Feature geometry may consist of points, lines, or areas. », « Features with no geometry
    are also supported. ») mais hors extrait. Usage baissé : l''énoncé dit plus que l''extrait.'
- id: A-nom-07
  question: Q3
  enonce: Dans FME, les attributs utilisateur font toujours partie de la feature, quel que soit le format dans lequel ils
    sont stockés.
  usage: narration
  sources:
  - url: https://docs.safe.com/fme/html/FME-Form-Documentation/FME-ReadersWriters/aboutFeatures/feature-type-attributes-about.htm
    titre: About Feature Type Attributes (FME Readers and Writers 2026.3)
    editeur: Safe Software
    niveau: A
    consulte: 2026-11-26
    extrait: User attributes are always part of the feature no matter which format they are stored in.
  contradictions: []
  verifie: true
  note_verification: ''
- id: A-nom-08
  question: Q3
  enonce: Toute feature traitée par FME connaît son système de coordonnées et donc sa position sur la Terre.
  usage: narration
  sources:
  - url: https://docs.safe.com/fme/html/FME-Form-Documentation/FME-Form/CoordSys/coord_sys_about.htm
    titre: About Coordinate Systems (FME Form 2025.2)
    editeur: Safe Software
    niveau: A
    consulte: 2026-11-26
    extrait: All FME features know about their coordinate system and, therefore, their location on the earth.
  contradictions: []
  verifie: true
  note_verification: ''
- id: A-nom-09
  question: Q3
  enonce: Selon la documentation, FME lit les données source et stocke l'information de leurs features dans des attributs
    de format, puis écrit les données de destination en créant un second jeu d'attributs de format.
  usage: expert
  sources:
  - url: https://docs.safe.com/fme/html/FME-Form-Documentation/FME-ReadersWriters/aboutFeatures/feature-type-attributes-about.htm
    titre: About Feature Type Attributes (FME Readers and Writers 2026.3)
    editeur: Safe Software
    niveau: A
    consulte: 2026-11-26
    extrait: FME reads the source data and stores information about its features in format attributes.
  - url: https://docs.safe.com/fme/html/FME-Form-Documentation/FME-ReadersWriters/aboutFeatures/feature-type-attributes-about.htm
    titre: About Feature Type Attributes (FME Readers and Writers 2026.3)
    editeur: Safe Software
    niveau: A
    consulte: 2026-11-26
    extrait: FME writes the destination data by creating a second set of format attributes.
  contradictions: []
  verifie: null
  repare: true
  note_verification: 'Vérification : l''extrait ne porte que la lecture ; l''écriture (« FME writes the destination data by
    creating a second set of format attributes. ») est une autre phrase de la page, hors extrait. Usage baissé : l''énoncé
    dit plus que l''extrait.'
- id: A-nom-10
  question: Q3
  enonce: 'La documentation d''FME Form organise le travail en deux gestes distincts : lire et écrire les données avec des
    readers et des writers, transformer les données avec des transformers.'
  usage: expert
  sources:
  - url: https://docs.safe.com/fme/html/FME-Form-Documentation/FME-Form/Home.htm
    titre: FME Form Documentation (accueil)
    editeur: Safe Software
    niveau: A
    consulte: 2026-11-26
    extrait: How to work with Transformers to manipulate data.
  - url: https://docs.safe.com/fme/html/FME-Form-Documentation/FME-Form/Home.htm
    titre: FME Form Documentation (accueil)
    editeur: Safe Software
    niveau: A
    consulte: 2026-11-26
    extrait: "Reading and Writing Data How to work with Readers and Writers."
  contradictions: []
  verifie: null
  repare: true
  note_verification: 'Vérification : l''extrait ne parle que des transformers. « Deux gestes distincts » est une lecture de
    la table des matières de l''accueil (Reading and Writing Data, Transforming Data, puis Coordinate Systems et d''autres
    rubriques) : la page ne dit pas que le travail s''organise en deux gestes. Usage baissé.'
  note_reparation: 'La page d''accueil liste Reading and Writing Data et Transforming Data comme rubriques parmi d''autres (Coordinate Systems, etc.) ; aucune phrase ne dit que le travail s''organise en deux gestes distincts. Énoncé laissé tel quel.'
