affirmations:
- id: A-nom-01
  question: Q1
  enonce: Dans la norme ISO 19101, une feature est l'abstraction d'un phénomène du monde réel.
  usage: expert
  sources:
  - url: https://www.w3.org/2015/spatial/track/issues/190
    titre: 'ISSUE-190: SDW BP Glossary Issue: Features (cite la définition ISO 19101)'
    editeur: W3C
    niveau: B
    consulte: 2026-11-26
    extrait: 'Feature: Abstraction of a real world phenomenon.'
  contradictions: []
  verifie: true
  note_verification: 'Vérification : le W3C cite la définition sous « ISO 19101 and OGC OpenGIS Abstract Specification Topic
    5 » ; l''attribution à ISO 19101 est fidèle, mais de seconde main.'
- id: A-nom-02
  question: Q1
  enonce: 'Le glossaire cité par le W3C donne comme exemples de features presque tout ce qui peut être placé dans le temps
    et l''espace : bureaux, bâtiments, villes, arbres, pipelines, et précise que les termes feature et objet sont souvent
    employés comme synonymes.'
  usage: contexte
  sources:
  - url: https://www.w3.org/2015/spatial/track/issues/190
    titre: 'ISSUE-190: SDW BP Glossary Issue: Features'
    editeur: W3C
    niveau: B
    consulte: 2026-11-26
    extrait: The terms feature and object are often used synonymously.
  contradictions: []
  verifie: null
  note_verification: ''
- id: A-nom-03
  question: Q1
  enonce: Simple Feature Access, partie 1, est aussi publiée comme ISO 19125 et décrit l'architecture commune de la géométrie
    des simple features.
  usage: contexte
  sources:
  - url: https://www.ogc.org/standards/sfa/
    titre: 'Simple Feature Access – Part 1: Common Architecture'
    editeur: OGC
    niveau: A
    consulte: 2026-11-26
    extrait: This part of Simple Features Access (SFA), also called ISO 19125, describes the common architecture
  contradictions: []
  verifie: null
  note_verification: ''
