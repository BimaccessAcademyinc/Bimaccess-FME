lacunes:
  - question: Q10
    manque: "Texte officiel ISO 19111 : iso.org refuse (403) ; le texte OGC Topic 2 (docs.ogc.org) est lu à la place. Les mots du texte OGC sont à vérifier à la main contre l'édition ISO 19111:2019 si l'expert veut citer l'ISO."
  - question: Q10
    manque: "Définition sourcée d'une « projection » en parties (unités, ellipsoïde dans le datum) autre que la définition de la norme ; la liste « datum, ellipsoïde, projection, unités » comme parties d'un CRS est reconstruite depuis des définitions séparées et la structure des fiches EPSG, pas énoncée telle quelle par une source. À sourcer."
  - question: Q11
    manque: "Pages NRCan sur NAD83(CSRS), UTM et MTM illisibles par le script (texte vide, page rendue par script) : à vérifier à la main sur natural-resources.canada.ca ; aucune source fédérale lue sur UTM, MTM ni NAD83(CSRS)."
  - question: Q11
    manque: "Paramètres de Lambert-93 (parallèles de référence 44 et 49 degrés N) et année de définition légale : non lus dans une page source (page IGN générique, décret non lu). À sourcer."
  - question: Q11
    manque: "Lien exact entre WGS 84 (EPSG:4326) et NAD83 / RGF93 (différences de référentiel de l'ordre du mètre) : non trouvé. À sourcer."
  - question: Q12
    manque: "Écart documenté pour deux données dans deux systèmes NON reprojetées au Canada (autre que le cas NAD27 vers NAD83) ou pour un datum mal déclaré en France (NTF vers RGF93) : non trouvé. Statistique Canada (403) et NRCan (illisible) non lus."
  - question: Q12
    manque: "Les chiffres NAD27 contre NAD83 mesurent l'écart de datum entre deux systèmes ; ils ne décrivent pas directement l'écart visuel de deux couches superposées sans reprojection. Mise en garde pour le scénariste : ne pas reformuler en « décalage de X mètres à l'écran »."
