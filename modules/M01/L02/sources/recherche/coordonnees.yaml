axe: coordonnees
affirmations:
  - id: A-coordonnees-01
    question: Q10
    enonce: "Selon la norme internationale de référencement par coordonnées, reprise par l'OGC, un système de référence de coordonnées est un système de coordonnées relié à un objet par un référentiel (datum)."
    usage: narration
    sources:
      - url: https://docs.ogc.org/as/18-005r5/18-005r5.html
        titre: "OGC Abstract Specification Topic 2: Referencing by coordinates Corrigendum"
        editeur: Open Geospatial Consortium
        niveau: A
        consulte: 2026-11-27
        extrait: "coordinate system that is related to an object by a datum"
    contradictions: []
    verifie: null
    note_verification: ""
  - id: A-coordonnees-02
    question: Q10
    enonce: "Un système de coordonnées est défini comme un ensemble de règles mathématiques qui disent comment attribuer des coordonnées à des points."
    usage: narration
    sources:
      - url: https://docs.ogc.org/as/18-005r5/18-005r5.html
        titre: "OGC Abstract Specification Topic 2: Referencing by coordinates Corrigendum"
        editeur: Open Geospatial Consortium
        niveau: A
        consulte: 2026-11-27
        extrait: "set of mathematical rules for specifying how coordinates are to be assigned to points"
    contradictions: []
    verifie: null
    note_verification: ""
  - id: A-coordonnees-03
    question: Q10
    enonce: "Le référentiel (datum) est l'ensemble des paramètres qui fixent la position de l'origine, l'échelle et l'orientation d'un système de coordonnées."
    usage: narration
    sources:
      - url: https://docs.ogc.org/as/18-005r5/18-005r5.html
        titre: "OGC Abstract Specification Topic 2: Referencing by coordinates Corrigendum"
        editeur: Open Geospatial Consortium
        niveau: A
        consulte: 2026-11-27
        extrait: "parameter or set of parameters that realize the position of the origin, the scale, and the orientation of a coordinate system"
    contradictions: []
    verifie: null
    note_verification: ""
  - id: A-coordonnees-04
    question: Q10
    enonce: "L'ellipsoïde est une surface géométrique de référence, formée par une ellipse qu'on fait tourner autour d'un axe principal."
    usage: contexte
    sources:
      - url: https://docs.ogc.org/as/18-005r5/18-005r5.html
        titre: "OGC Abstract Specification Topic 2: Referencing by coordinates Corrigendum"
        editeur: Open Geospatial Consortium
        niveau: A
        consulte: 2026-11-27
        extrait: "geometric reference surface embedded in 3D Euclidean space formed by an ellipse that is rotated about a main axis"
    contradictions: []
    verifie: null
    note_verification: ""
  - id: A-coordonnees-05
    question: Q10
    enonce: "Une projection cartographique est une conversion de coordonnées d'un système ellipsoïdal vers un plan."
    usage: narration
    sources:
      - url: https://docs.ogc.org/as/18-005r5/18-005r5.html
        titre: "OGC Abstract Specification Topic 2: Referencing by coordinates Corrigendum"
        editeur: Open Geospatial Consortium
        niveau: A
        consulte: 2026-11-27
        extrait: "coordinate conversion from an ellipsoidal coordinate system to a plane"
    contradictions: []
    verifie: null
    note_verification: ""
  - id: A-coordonnees-06
    question: Q10
    enonce: "Un système de référence de coordonnées projeté est dérivé d'un système géographique par l'application d'une projection cartographique."
    usage: narration
    sources:
      - url: https://docs.ogc.org/as/18-005r5/18-005r5.html
        titre: "OGC Abstract Specification Topic 2: Referencing by coordinates Corrigendum"
        editeur: Open Geospatial Consortium
        niveau: A
        consulte: 2026-11-27
        extrait: "coordinate reference system derived from a geographic coordinate reference system by applying a map projection"
    contradictions: []
    verifie: null
    note_verification: ""
  - id: A-coordonnees-07
    question: Q10
    enonce: "Dans un système de référence de coordonnées spatial, les nombres de coordonnées sont qualifiés par des unités."
    usage: narration
    sources:
      - url: https://docs.ogc.org/as/18-005r5/18-005r5.html
        titre: "OGC Abstract Specification Topic 2: Referencing by coordinates Corrigendum"
        editeur: Open Geospatial Consortium
        niveau: A
        consulte: 2026-11-27
        extrait: "In a spatial coordinate reference system, the coordinate numbers are qualified by units."
    contradictions: []
    verifie: null
    note_verification: ""
  - id: A-coordonnees-08
    question: Q10
    enonce: "Une transformation de coordonnées opère entre deux systèmes de référence de coordonnées, non entre deux référentiels ; elle change les valeurs des coordonnées sans changer la définition du référentiel."
    usage: narration
    sources:
      - url: https://docs.ogc.org/as/18-005r5/18-005r5.html
        titre: "OGC Abstract Specification Topic 2: Referencing by coordinates Corrigendum"
        editeur: Open Geospatial Consortium
        niveau: A
        consulte: 2026-11-27
        extrait: "A coordinate transformation changes coordinate values. It does not change the definition of the datum."
      - url: https://docs.ogc.org/as/18-005r5/18-005r5.html
        titre: "OGC Abstract Specification Topic 2: Referencing by coordinates Corrigendum"
        editeur: Open Geospatial Consortium
        niveau: A
        consulte: 2026-11-27
        extrait: "A coordinate transformation operates between two coordinate reference systems, not between two datums."
    contradictions: []
    verifie: null
    note_verification: ""
  - id: A-coordonnees-09
    question: Q11
    enonce: "Le jeu de données EPSG de l'IOGP contient de nombreuses définitions de systèmes de référence de coordonnées et de transformations de coordonnées, de portée mondiale, régionale, nationale ou locale."
    usage: narration
    sources:
