        titre: "EPSG Geodetic Parameter Dataset"
        editeur: IOGP
        niveau: A
        consulte: 2026-11-27
        extrait: "IOGP's EPSG Geodetic Parameter Dataset contains many definitions of coordinate reference systems (CRSs) and coordinate transformations (CTs) which can be global, regional, national, or local in application."
    contradictions: []
