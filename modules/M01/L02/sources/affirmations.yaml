  note_verification: 'Vérification : La phrase de l''IGIF reprend celle du guide des normes de 2013, préparé par l''ISO/TC 211, l''OGC et l''OHI, auquel la voie stratégique 6 renvoie : ce n''est pas une source indépendante. Confiance réelle moyenne, venue des organismes concernés (primaire) ; narration admise (pas de date ni de chiffre), mais l''ajout ne vaut pas forte.'
- id: A-semantique-29
  question: Q13
  enonce: Quand la terminologie ou la sémantique des modèles de données diffère, la mise en correspondance des données devient difficile, voire impossible.
