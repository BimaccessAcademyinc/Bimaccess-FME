lacunes:
- axe: interop
  question: Q1
  manque: 'Le texte officiel d''ISO 19101-1 pour la définition d''interopérabilité (clause 4) n''a pas été lu : iso.org refuse (403) et l''extrait public ne l''a pas rendu. La définition de l''OGC (2004) n''a pas été retrouvée sur ogc.org ; seule une citation de seconde main existe (A-interop-03). À vérifier à la main.'
  apres_consolidation: 'Consolidation : la définition d''INSPIRE est reprise mot pour mot par une publication académique indépendante (Chojka, 2020), A-interop-01 passe en confiance forte. Le texte ISO 19101-1 et la définition OGC (2004) restent non lus.'
- axe: interop
  question: Q2
  manque: 'Le texte de l''annexe B d''ISO 19101-1 (couches d''interopérabilité) n''est pas dans l''extrait public ; la définition normative de chaque niveau (système, syntaxique, structurel, sémantique) n''a pas été lue. La notice de l''Encyclopedia of GIS (Springer) a répondu 429 : à vérifier à la main. Les définitions de niveaux trouvées viennent d''articles ISPRS et d''un wiki.'
  apres_consolidation: 'Consolidation : le rapport OGC Testbed-12 définit aussi l''interopérabilité sémantique (lu dans la page déjà en cache) ; avec Chojka (2020), les niveaux syntaxique et sémantique ont chacun une définition en confiance forte (A-interop-13, A-interop-14), et les quatre niveaux d''ISO 19101-1 sont confirmés par Chojka (A-interop-04, forte). Le niveau structurel n''a toujours que l''article ISPRS (A-interop-06, faible).'
- axe: interop
  question: Q3
  manque: 'Aucun chiffre de coût propre à l''interopérabilité des données géographiques n''a été trouvé dans une source primaire (recherches sur INSPIRE, JRC, SDI espagnole : analyses de coûts-bénéfices sans chiffre isolable lu). Un article arXiv attribue des chiffres à l''évaluation INSPIRE de 2022 ; ils n''ont pas été retrouvés dans les documents de la Commission et ne sont pas repris. À sourcer.'
- axe: formats
  question: Q6
  manque: 'Nombre de formats de GDAL/OGR : le catalogue des pilotes (gdal.org, drivers/vector) est un tableau sans total énoncé ; aucun chiffre sourcé.'
- axe: formats
  question: Q6
  manque: 'Source indépendante de l''éditeur pour le nombre de formats de FME : aucune trouvée ; la page Esri affiche 300+ (non datée), la page FME 800+. À vérifier à la main (page des formats de l''éditeur : 404 à l''adresse essayée).'
- axe: formats
  question: Q6
  manque: 'Nombre de formats de données géographiques en circulation, toutes sources confondues : à sourcer.'
- axe: formats
  question: Q4
  manque: 'Source primaire d''Autodesk sur DWG, et statut ou spécification de DGN (Bentley) : non lus ; à sourcer.'
- axe: formats
  question: Q4
  manque: 'Date du shapefile confirmée par une source indépendante d''Esri : à sourcer.'
- axe: formats
  question: Q5
  manque: 'Perte de styles en changeant de format, et limite de longueur des champs texte du dBASE : à sourcer.'
- axe: modeles
  question: Q7
  manque: 'Le texte intégral d''ISO 19109 (classes d''entités, associations, règles en UML) n''a été lu que sur l''extrait public de 2005 : iso.org refuse (403) ; l''édition 2015/2025 n''a pas été lue. À sourcer.'
- axe: modeles
  question: Q8
  manque: Aucune source lue ne décrit en toutes lettres 'attributs à plat contre structures imbriquées' pour le shapefile ou la comparaison simple/topologique d'OGC Simple Features ; la page Bentley sur l'écart avec Simple Feature Access n'a pas pu être lue (URL avec espace refusée par le script). À sourcer.
- axe: modeles
  question: Q8
  manque: 'Détail de la topologie arcs-nœuds (ISO 19107, TP_Complex) : seuls les titres de chapitres et la portée sont lus. À sourcer.'
- axe: modeles
  question: Q9
  manque: 'Aucune définition de ''schema mapping'' par l''OGC ni guide INSPIRE actuel lu : seul le guide technique JRC v2.0 (mention Draft) et deux travaux de projet (DGT, Nordic Journal) ; core.ac.uk (403) et ijsdir (404) non lus. À sourcer.'
- axe: coordonnees
  question: Q10
  manque: 'Texte officiel ISO 19111 : iso.org refuse (403) ; le texte OGC Topic 2 (docs.ogc.org) est lu à la place. Les mots du texte OGC sont à vérifier à la main contre l''édition ISO 19111:2019 si l''expert veut citer l''ISO.'
- axe: coordonnees
  question: Q10
  manque: Définition sourcée d'une « projection » en parties (unités, ellipsoïde dans le datum) autre que la définition de la norme ; la liste « datum, ellipsoïde, projection, unités » comme parties d'un CRS est reconstruite depuis des définitions séparées et la structure des fiches EPSG, pas énoncée telle quelle par une source. À sourcer.
- axe: coordonnees
  question: Q11
  manque: 'Pages NRCan sur NAD83(CSRS), UTM et MTM illisibles par le script (texte vide, page rendue par script) : à vérifier à la main sur natural-resources.canada.ca ; aucune source fédérale lue sur UTM, MTM ni NAD83(CSRS).'
- axe: coordonnees
  question: Q11
  manque: 'Paramètres de Lambert-93 (parallèles de référence 44 et 49 degrés N) et année de définition légale : non lus dans une page source (page IGN générique, décret non lu). À sourcer.'
- axe: coordonnees
  question: Q11
  manque: 'Lien exact entre WGS 84 (EPSG:4326) et NAD83 / RGF93 (différences de référentiel de l''ordre du mètre) : non trouvé. À sourcer.'
- axe: coordonnees
  question: Q12
  manque: 'Écart documenté pour deux données dans deux systèmes NON reprojetées au Canada (autre que le cas NAD27 vers NAD83) ou pour un datum mal déclaré en France (NTF vers RGF93) : non trouvé. Statistique Canada (403) et NRCan (illisible) non lus.'
  apres_consolidation: 'Consolidation : l''écart NAD 27 vers NAD 83 de 10 à 100 m aux États-Unis est confirmé par le NGS (NOAA), source primaire (A-coordonnees-31, forte). Le cas canadien (Alberta) reste sur une seule source B.'
- axe: coordonnees
  question: Q12
  manque: 'Les chiffres NAD27 contre NAD83 mesurent l''écart de datum entre deux systèmes ; ils ne décrivent pas directement l''écart visuel de deux couches superposées sans reprojection. Mise en garde pour le scénariste : ne pas reformuler en « décalage de X mètres à l''écran ».'
- axe: semantique
  question: Q13
  manque: 'Exemples réels d''incompatibilité de nomenclatures (classes de routes, occupation du sol) : les pages MDPI et Taylor & Francis qui les décrivent refusent la lecture automatique (403) ; à vérifier à la main. Les définitions « mêmes mots pour deux choses / deux mots pour une chose » (homonymes, synonymes) n''ont pas été lues dans une phrase propre ; à sourcer.'
- axe: semantique
  question: Q13
  manque: 'Le cas concret du mot « forêt » défini différemment selon les pays (seuils de couvert, hauteur) : non trouvé dans une page lisible ; la recherche a signalé des définitions juridique, d''occupation du sol et d''usage, non lues ; à sourcer.'
  apres_consolidation: 'Consolidation : le cas « forêt » est sourcé par l''Agence européenne pour l''environnement et un article de l''Université de Leeds (A-semantique-23, forte) ; le détail des seuils (couvert, hauteur) par pays reste à sourcer.'
- axe: semantique
  question: Q14
  manque: 'Ce que les normes OGC et ISO ne résolvent pas : le seul énoncé lu est celui de l''article ISPRS (A-semantique-04) ; l''idée que des schémas d''application GML différents définissent les mêmes concepts de façons différentes n''a été vue que dans un résumé de recherche, pas dans le texte de la page ; à sourcer.'
- axe: semantique
  question: Q14
  manque: 'Une seconde source indépendante pour l''année de fondation de l''OGC (1994) et le nombre de normes : à sourcer.'
  apres_consolidation: 'Consolidation : le cadre IGIF de l''ONU (voie stratégique 6, texte daté de janvier 2022) écrit aussi que l''OGC a été fondé en 1994 ; A-semantique-09 porte sur la page de l''OGC elle-même et reste en expert. Le nombre de normes (150+) n''a toujours qu''une source.'
- axe: semantique
  question: Q15
  manque: 'Une source indépendante qui décrive le rôle de FME dans l''interopérabilité hors documentation de l''éditeur, de l''extension Esri et d''un guide JRC de 2010 : aucune étude ou comparaison indépendante trouvée ; à sourcer.'
- axe: consolidation
  question: Q9
  manque: 'Cas réel de différence de modèle avec une source indépendante : la carte COS portugaise vers INSPIRE (A-modeles-27 à 29) n''a que des documents de la DGT elle-même (la présentation hébergée par l''IDEE espagnole est aussi de la DGT). Confiance moyenne : à la porte.'
- axe: consolidation
  question: Q11
  manque: 'Définition normative d''un code EPSG : le guide IOGP 373-07-01 (Guidance Note 7-1) n''a pas été lu ; A-coordonnees-32 s''appuie sur la page « About » d''epsg.org et la FAQ de PROJ.'
- axe: consolidation
  question: Q14
  manque: 'Page de Lantmäteriet (agence cartographique suédoise) sur le comité ISO/TC 211 : 404. L''indépendance du cadre IGIF de l''ONU vis-à-vis de l''OGC et de l''ISO/TC 211 est à juger par le vérificateur (l''ONU travaille avec ces organismes ; le rapport UN-GGIM de 2013 est, lui, préparé par l''ISO/TC 211 avec l''OGC et l''OHI et compte comme leur source).'
- axe: consolidation
  question: Q10
  manque: 'Une seconde source indépendante de l''OGC pour la définition du système de référence de coordonnées (A-coordonnees-01 à 08, confiance moyenne) : non trouvée (glossaire PROJ et pages IGN sans définition lisible). La définition d''INSPIRE (A-coordonnees-33) est une autre définition, pas une confirmation.'
