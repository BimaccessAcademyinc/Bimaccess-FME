lacunes:
  - question: Q1
    manque: "Date exacte de l'annonce des nouveaux noms par Safe Software : la page de l'éditeur (safe.com/?p=168549) ne porte pas de date dans son texte. Les deux seules dates lues viennent de partenaires (Globema, avril 2023 ; GIM, 12 juin 2023). Source indépendante de l'éditeur sur la version 23.0 : non trouvée. À sourcer."
  - question: Q2
    manque: "Comment un espace de travail publié s'exécute sur FME Flow (soumission d'un travail, services) : relève de l'axe automatisation (Q3, Q4) ; non couvert ici. Une source indépendante de l'éditeur sur l'assistant de publication n'a pas été lue. À sourcer."
  - question: Q2
    manque: "Source indépendante (B) sur FME Flow Hosted : seule 1Spatial dit en être fournisseur, sans le définir ; non lu ailleurs. À sourcer."
