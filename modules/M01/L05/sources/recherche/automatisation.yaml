lacunes:
  - question: Q3
    manque: "Liste complète des déclencheurs et des actions : la page Automations Triggers de docs.safe.com est illisible par le script (rendue par script). Surveillance d'une base de données comme déclencheur : à sourcer."
  - question: Q4
    manque: "Définition d'un travail (job) en une phrase : la page Jobs ne le définit pas ; la page de terminologie « job queue » est illisible par le script. À vérifier à la main."
  - question: Q4
    manque: "Cas documenté de publication de données géographiques avec une source indépendante de l'éditeur et du partenaire : non trouvé. Autres cas vus dans la recherche (Wellington, Qualicum Beach, Auckland) non lus : à sourcer."
